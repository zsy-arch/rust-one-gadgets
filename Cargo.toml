[package]
name = "rog"
version = "0.1.0"
edition = "2021"
description = "A fast, cross-platform one_gadget replacement in Rust"
license = "MIT"

[dependencies]
goblin = "0.9"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "op_code_info", "intel"] }
yaxpeax-arm = "0.5"
yaxpeax-arch = "0.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1

[[bin]]
name = "rog"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"
